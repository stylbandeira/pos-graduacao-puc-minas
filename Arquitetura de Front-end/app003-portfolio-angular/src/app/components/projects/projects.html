<section id="projetos" class="section" aria-labelledby="projects-title">
  <div class="container">
    <p class="eyebrow">Portfólio</p>
    <h2 id="projects-title">Projetos em destaque</h2>
    <div class="project-grid">
      @for (project of projects; track project.title) {
        <article class="project-card">
          <div class="project-image">Imagem do projeto</div>
          <div class="project-body">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
            <div class="tags">@for (technology of project.technologies; track technology) { <span>{{ technology }}</span> }</div>
            <a class="text-link" [href]="project.github" target="_blank" rel="noopener noreferrer">Ver projeto →</a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
