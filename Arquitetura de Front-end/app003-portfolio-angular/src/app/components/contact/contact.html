<section id="contato" class="section contact" aria-labelledby="contact-title">
  <div class="container contact-grid">
    <div>
      <p class="eyebrow">Vamos conversar</p>
      <h2 id="contact-title">Entre em contato</h2>
      <p class="muted">Use este formulário como ponto de partida para receber mensagens.</p>
    </div>
    <form class="contact-form">
      <label>Nome<input type="text" name="name" placeholder="Seu nome"></label>
      <label>E-mail<input type="email" name="email" placeholder="seu@email.com"></label>
      <label>Mensagem<textarea name="message" rows="5" placeholder="Escreva sua mensagem"></textarea></label>
      <button class="button" type="submit">Enviar mensagem</button>
    </form>
  </div>
</section>
